  <!-- reels e imágenes 3D: en la compu, carrusel de a uno con flechas (como Posters); en el celular, uno debajo del otro. -->
  <main class="reels" id="contenido">
    <h1 class="visualmente-oculto" data-i18n="titulo.modelado">3D + Motion Graphics</h1>
    <button type="button" class="poster-arrow reels-prev" aria-label="Anterior" data-i18n-aria="reels.anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <div class="reels-pista">
      <figure class="reel is-activo">
        <video src="assets/reels/reel-1.mp4" width="982" height="1920" autoplay muted loop playsinline aria-label="Reel 1"></video>

      <figure class="reel">
        <video src="assets/reels/reel-2.mp4" width="1080" height="1486" autoplay muted loop playsinline aria-label="Reel 2"></video>
